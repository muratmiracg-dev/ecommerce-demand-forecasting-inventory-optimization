name: Analytics quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run deterministic pipeline
        env:
          PYTHONPATH: Python/src
        run: python -m ecom_opt.run_pipeline

      - name: Run business-rule tests
        env:
          PYTHONPATH: Python/src
        run: pytest -q

      - name: Confirm validation reports
        run: |
          python -c "import json; assert json.load(open('Data/validation_report.json'))['all_passed']"
          python -c "import json; assert json.load(open('PowerBI/Ecommerce_Demand_Inventory_PBIP/pbip_validation.json'))['valid']"
